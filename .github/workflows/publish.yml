name: Publish to PyPI

# Integration releases are tagged v* (for example v0.2.0) and are installed
# by HACS. Those tags must not publish pyalula: the integration vendors it.
# Publish the standalone library only from a pyalula-v* tag.
on:
  push:
    tags:
      - "pyalula-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
